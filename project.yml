# TrueFocus — Xcode project spec.
#
#   brew install xcodegen
#   cp Config/Local.example.xcconfig Config/Local.xcconfig   # put your Team ID + bundle prefix there
#   xcodegen
#   open TrueFocus.xcodeproj
#
# The .xcodeproj is generated; never edit it by hand.

name: TrueFocus

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Versions for every target (apps and extensions must match). Local builds use these;
    # the Release workflow (.github/workflows/release.yml) overrides both on the xcodebuild
    # command line: MARKETING_VERSION from the v* tag or the run's input, and
    # CURRENT_PROJECT_VERSION from the GitHub run number. See docs/RELEASE.md.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  TrueFocusKit:
    path: Packages/TrueFocusKit

targets:

  # ───────────────────────────────── iPhone ─────────────────────────────────

  TrueFocus:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: iOSExtensions/ScreenTimeShared
      - path: PrivacyManifests/iOSApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
      - target: TrueFocusWidgets
      - target: TrueFocusMonitor
      - target: TrueFocusShieldConfig
      - target: TrueFocusShieldAction
      - target: TrueFocusSafariiOS
    settings:
      base:
        PRODUCT_NAME: TrueFocus
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPaper
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: TruFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification, audio]
        NSAppleMusicUsageDescription: TruFocus plays an Apple Music focus playlist while you work, if you choose it in Settings.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.truefocus
            CFBundleURLSchemes: [truefocus]
        TFAppGroup: $(TF_APP_GROUP)
        TFSupabaseHost: $(TF_SUPABASE_HOST)
        TFSupabaseKey: $(TF_SUPABASE_ANON_KEY)
    entitlements:
      path: iOS/App/TrueFocus.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(TF_APP_GROUP)]
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    scheme:
      gatherCoverageData: false

  TrueFocusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSExtensions/Widgets
      - path: Shared/LiveActivity
      - path: Shared/Intents/FlowIntents.swift
      - path: Shared/Design/Theme.swift
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSExtensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: TruFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOSExtensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(TF_APP_GROUP)]

  TrueFocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSExtensions/Monitor
      - path: iOSExtensions/ScreenTimeShared
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.monitor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSExtensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: TruFocus Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TFMonitor
    entitlements:
      path: iOSExtensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(TF_APP_GROUP)]

  TrueFocusShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSExtensions/ShieldConfiguration
      - path: iOSExtensions/ScreenTimeShared
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.shieldconfig
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSExtensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: TruFocus Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TFShieldConfiguration
    entitlements:
      path: iOSExtensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(TF_APP_GROUP)]

  TrueFocusShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSExtensions/ShieldAction
      - path: iOSExtensions/ScreenTimeShared
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.shieldaction
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSExtensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: TruFocus Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TFShieldAction
    entitlements:
      path: iOSExtensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(TF_APP_GROUP)]

  TrueFocusSafariiOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Safari/SafariWebExtensionHandler.swift
      - path: Extensions/web
        buildPhase: resources
        excludes: ["test/**", "package.json", "README.md"]
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.safari
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Extensions/Safari/iOS/Info.plist
      properties:
        CFBundleDisplayName: TruFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extensions/Safari/iOS/Safari.entitlements
      properties:
        com.apple.security.application-groups: [$(TF_APP_GROUP)]

  # ────────────────────────────────── Mac ──────────────────────────────────

  TrueFocusMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["LiveActivity/**"]
      - path: macOS
      - path: PrivacyManifests/MacApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
      - target: TrueFocusSafariMac
    settings:
      base:
        PRODUCT_NAME: TruFocus
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macOS/App/Info.plist
      properties:
        CFBundleDisplayName: TruFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Built for hyperfocus. Not against it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.truefocus
            CFBundleURLSchemes: [truefocus]
        TFAppGroup: $(TF_APP_GROUP)
        TFSupabaseHost: $(TF_SUPABASE_HOST)
        TFSupabaseKey: $(TF_SUPABASE_ANON_KEY)
    entitlements:
      path: macOS/App/TrueFocus.entitlements
      properties:
        com.apple.security.application-groups: [$(TF_APP_GROUP)]
    scheme:
      gatherCoverageData: false

  TrueFocusSafariMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Safari/SafariWebExtensionHandler.swift
      - path: Extensions/web
        buildPhase: resources
        excludes: ["test/**", "package.json", "README.md"]
      - path: PrivacyManifests/Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TrueFocusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TF_BUNDLE_PREFIX).truefocus.mac.safari
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TF_EXTENSION
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Extensions/Safari/macOS/Info.plist
      properties:
        CFBundleDisplayName: TruFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        TFAppGroup: $(TF_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extensions/Safari/macOS/Safari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TF_APP_GROUP)]
