<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruFocus particle mark</title>
<style>
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  p { position: fixed; left: 0; right: 0; bottom: 28px; margin: 0; text-align: center; color: #6B6B70; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="c" aria-label="TruFocus mark: scattered particles gather into a ring around a glowing core"></canvas>
<p>Tap to scatter. Watch it find focus.</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, S, cx, cy, P = [];
const N_RING = 2600, N_CORE = 1100, N_STRAY = 160, GA = Math.PI * (3 - Math.sqrt(5));
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function colour(t) { // 0 hot centre -> 1 deep
  const hot = [255, 196, 168], mid = [255, 90, 31], deep = [160, 36, 8];
  const [a, b, k] = t < 0.5 ? [hot, mid, t / 0.5] : [mid, deep, (t - 0.5) / 0.5];
  return a.map((v, i) => Math.round(v + (b[i] - v) * k));
}
function build() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
  S = Math.min(W, H) * 0.42; cx = W / 2; cy = H / 2;
  const R = S * 37 / 40, core = S * 14 / 40, w = S * 4 / 40;
  P = [];
  for (let i = 0; i < N_RING; i++) {
    const a = Math.random() * Math.PI * 2, r = R + gauss() * w * 0.7;
    P.push({ a, r, tx: 0, ty: 0, size: (0.7 + Math.random() * 0.9) * dpr, c: colour(0.5 + Math.abs(r - R) / w * 0.3), al: 0.4 + Math.random() * 0.5, spin: 0.00025 });
  }
  for (let i = 1; i <= N_CORE; i++) {
    const t = Math.sqrt(i / N_CORE), r = core * t;
    P.push({ a: i * GA, r, size: (1.4 - t * 0.6) * dpr, c: colour(0.1 + t * 0.5), al: 0.55 + Math.random() * 0.4, spin: 0.0006 });
  }
  for (let i = 0; i < N_STRAY; i++) {
    P.push({ a: Math.random() * Math.PI * 2, r: core * 1.2 + Math.random() * (R * 1.2 - core), size: 0.8 * dpr, c: colour(0.8), al: 0.15 + Math.random() * 0.25, spin: 0.0002 });
  }
  scatter(true);
}
function scatter(instant) {
  for (const p of P) {
    p.x = Math.random() * W; p.y = Math.random() * H;
    p.k = 0.012 + Math.random() * 0.03;
    if (!instant) { p.x = cx + (p.x - cx) * 1.2; p.y = cy + (p.y - cy) * 1.2; }
  }
}
let t = 0;
function frame() {
  t += 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,5,6,0.32)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.95);
  g.addColorStop(0, 'rgba(255,80,25,0.10)'); g.addColorStop(1, 'rgba(255,80,25,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const breathe = 1 + Math.sin(t / 90) * 0.012;
  for (const p of P) {
    p.a += p.spin;
    const tx = cx + Math.cos(p.a) * p.r * breathe, ty = cy + Math.sin(p.a) * p.r * breathe;
    p.x += (tx - p.x) * p.k; p.y += (ty - p.y) * p.k;
    ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.al * 0.5})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  if (!reduce) requestAnimationFrame(frame);
}
addEventListener('resize', build);
addEventListener('pointerdown', () => scatter(false));
build();
if (reduce) { for (const p of P) { p.k = 1; } frame(); } else frame();
</script>
</body>
</html>
