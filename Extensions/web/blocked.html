<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TrueFocus</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body data-reason="doomscroll">
  <main class="stage">
    <div class="eyebrow"><span class="dot"></span><span id="eyebrow">TrueFocus</span></div>
    <h1 id="title">Back to work.</h1>
    <p class="lede" id="lede"></p>
    <p class="detail" id="detail" hidden></p>
    <section class="figure" id="figure" hidden>
      <div class="numerals" id="numerals">0:00</div>
      <div class="caption" id="caption"></div>
    </section>
    <div class="actions">
      <button class="primary" id="back" type="button">Back to work</button>
      <a class="quiet" id="respond" hidden>Reply to messages</a>
    </div>
  </main>
  <footer class="foot">
    <span class="brand">TrueFocus</span>
    <span class="task" id="task"></span>
  </footer>
  <script src="core.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
