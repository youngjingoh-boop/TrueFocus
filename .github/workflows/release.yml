name: Release

# iPhone: archive, sign for App Store Connect and upload to TestFlight.
# Mac:    archive, sign with Developer ID, notarize, staple, zip (direct download).
#
# Runbook: docs/RELEASE.md. Secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8          required, App Store Connect API key (Admin)
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD          optional, Mac signing fallback
#   APPLE_DEVELOPMENT_P12_BASE64, APPLE_DEVELOPMENT_P12_PASSWORD optional, see RELEASE.md
# Variables: BUILD_NUMBER_OFFSET (optional, default 0) is added to the run number;
#            XCODE_VERSION (optional, e.g. 26.0.1) pins the Xcode, else the newest release one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.1 (empty = MARKETING_VERSION in project.yml)"
        required: false
        default: ""
      ios:
        description: "iPhone: archive and upload to TestFlight"
        type: boolean
        default: true
      mac:
        description: "Mac: archive, notarize and package (Developer ID)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version numbers
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.numbers.outputs.marketing }}
      build: ${{ steps.numbers.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: numbers
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          bash scripts/release/version.sh | tee -a "$GITHUB_OUTPUT"

  ios:
    name: iPhone → TestFlight
    needs: version
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: bash scripts/release/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Set up signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: bash scripts/release/setup-signing.sh

      - name: Archive
        run: bash scripts/release/archive.sh TrueFocus 'generic/platform=iOS' "$RUNNER_TEMP/TrueFocus-iOS.xcarchive"

      - name: Sign and upload to App Store Connect
        run: bash scripts/release/export.sh "$RUNNER_TEMP/TrueFocus-iOS.xcarchive" Config/ExportOptions/AppStore.plist "$RUNNER_TEMP/export-ios"

      - name: Summary
        run: |
          {
            echo "### iPhone $MARKETING_VERSION ($BUILD_NUMBER) uploaded"
            echo "It shows up in App Store Connect > TrueFocus > TestFlight once processing finishes (usually 5–30 min)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          find "$RUNNER_TEMP/export-ios" -name "*.log" -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs-ios
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: Clean up signing
        if: always()
        run: bash scripts/release/cleanup-signing.sh

  mac:
    name: Mac → notarized download
    needs: version
    if: github.event_name == 'push' || inputs.mac
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write   # draft GitHub release on v* tags
    env:
      MARKETING_VERSION: ${{ needs.version.outputs.marketing }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: bash scripts/release/select-xcode.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Set up signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: bash scripts/release/setup-signing.sh

      - name: Archive
        run: bash scripts/release/archive.sh TrueFocusMac 'generic/platform=macOS' "$RUNNER_TEMP/TrueFocus-Mac.xcarchive"

      - name: Sign with Developer ID
        run: bash scripts/release/export.sh "$RUNNER_TEMP/TrueFocus-Mac.xcarchive" Config/ExportOptions/DeveloperID.plist "$RUNNER_TEMP/export-mac"

      - name: Notarize, staple and zip
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          bash scripts/release/notarize-mac.sh "$RUNNER_TEMP/export-mac/TruFocus.app" \
            "$RUNNER_TEMP/dist/TrueFocus-$MARKETING_VERSION-$BUILD_NUMBER-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFocus-${{ env.MARKETING_VERSION }}-${{ env.BUILD_NUMBER }}-mac
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

      - name: Attach to a draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$RUNNER_TEMP/dist/TrueFocus-$MARKETING_VERSION-$BUILD_NUMBER-mac.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --draft --verify-tag \
              --title "TrueFocus $MARKETING_VERSION" --generate-notes
          fi

      - name: Summary
        run: |
          {
            echo "### Mac $MARKETING_VERSION ($BUILD_NUMBER) notarized"
            echo "Download it from this run's artifacts$([ "$GITHUB_REF_TYPE" = tag ] && echo " or the draft release $GITHUB_REF_NAME")."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          find "$RUNNER_TEMP/export-mac" -name "*.log" -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs-mac
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: Clean up signing
        if: always()
        run: bash scripts/release/cleanup-signing.sh
